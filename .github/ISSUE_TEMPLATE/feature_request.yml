name: Feature request
description: Propose a concrete improvement to Orchestra.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or limitation should Orchestra address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the result and user-facing behavior, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: How are you handling this today, and what tradeoffs did you consider?
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and security impact
      description: Note effects on persisted data, commands, extensions, permissions, credentials, or provider costs.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: I can help test or implement this change.
          required: false
