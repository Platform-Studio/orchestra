// ── Agent runs modal ──────────────────────────────────────────
async function openActiveAgentsModal(initialRunId) {
  const overlay = document.getElementById('active-agents-modal');
  overlay.classList.remove('hidden');
  selectedAgentDetailTab = 'outputs';
  if (initialRunId) selectedAgentRunId = initialRunId;
  await refreshActiveAgentsModal();
  if (initialRunId && activeAgentRuns.some(r => r.run_id === initialRunId)) {
    await selectActiveAgentRun(initialRunId);
  }
  if (activeAgentPollTimer) clearInterval(activeAgentPollTimer);
  activeAgentPollTimer = setInterval(refreshActiveAgentsModal, 3000);
}

function closeActiveAgentsModal() {
  const overlay = document.getElementById('active-agents-modal');
  overlay.classList.add('hidden');
  if (activeAgentPollTimer) {
    clearInterval(activeAgentPollTimer);
    activeAgentPollTimer = null;
  }
  if (activeAgentTailTimer) {
    clearInterval(activeAgentTailTimer);
    activeAgentTailTimer = null;
  }
  selectedAgentRunId = null;
  selectedAgentArtifacts = null;
  selectedAgentArtifactsError = '';
  selectedAgentDetailTab = 'outputs';
  agentRunStatusFilter = DEFAULT_AGENT_RUN_STATUS_FILTER;
}

function setSelectedAgentDetailTab(tab) {
  const nextTab = String(tab || '').trim().toLowerCase();
  if (!['inputs', 'outputs', 'retries'].includes(nextTab)) return;
  captureAgentRunsScrollState();
  selectedAgentDetailTab = nextTab;
  renderActiveAgentsModal();
}

function captureAgentRunsScrollState() {
  const listEl = document.querySelector('#active-agents-content .agent-list');
  const detailEl = document.querySelector('#active-agents-content .agent-tail-panel');
  const promptEl = document.getElementById('active-agent-input-prompt');
  const outputEl = document.getElementById('active-agent-tail-output');
  const callsEl = document.getElementById('active-agent-artifacts');

  if (listEl) agentRunsScrollState.list = listEl.scrollTop;
  if (detailEl) agentRunsScrollState.detail = detailEl.scrollTop;
  if (promptEl) agentRunsScrollState.prompt = promptEl.scrollTop;
  if (outputEl) {
    agentRunsScrollState.output = outputEl.scrollTop;
    const nearBottom = (outputEl.scrollHeight - outputEl.clientHeight - outputEl.scrollTop) < 24;
    agentRunsScrollState.outputStickToBottom = nearBottom;
  }
  if (callsEl) agentRunsScrollState.calls = callsEl.scrollTop;
}

function restoreAgentRunsScrollState() {
  const listEl = document.querySelector('#active-agents-content .agent-list');
  const detailEl = document.querySelector('#active-agents-content .agent-tail-panel');
  const promptEl = document.getElementById('active-agent-input-prompt');
  const outputEl = document.getElementById('active-agent-tail-output');
  const callsEl = document.getElementById('active-agent-artifacts');

  if (listEl) listEl.scrollTop = agentRunsScrollState.list || 0;
  if (detailEl) detailEl.scrollTop = agentRunsScrollState.detail || 0;
  if (promptEl) promptEl.scrollTop = agentRunsScrollState.prompt || 0;
  if (outputEl) {
    if (agentRunsScrollState.outputStickToBottom) {
      outputEl.scrollTop = outputEl.scrollHeight;
    } else {
      outputEl.scrollTop = agentRunsScrollState.output || 0;
    }
  }
  if (callsEl) callsEl.scrollTop = agentRunsScrollState.calls || 0;
}

function normalizedRunStatus(run) {
  const status = String(run && run.status ? run.status : '').toLowerCase();
  if (status) return status;
  return run && run.ended_at ? 'completed' : 'running';
}

function runtimeDisplayLabel(runtime) {
  const runtimeValue = String(runtime || '').trim().toLowerCase();
  if (runtimeValue === 'cline') return 'Cline';
  if (runtimeValue === 'copilot') return 'Copilot';
  if (runtimeValue === 'claude-code' || runtimeValue === 'claude') return 'Claude Code';
  return runtimeValue ? runtimeValue.replace(/(^|[-_\s])([a-z])/g, (_, prefix, ch) => `${prefix}${ch.toUpperCase()}`) : 'Agent';
}

function providerDisplayLabel(provider) {
  const providerValue = String(provider || '').trim().toLowerCase();
  const labels = {
    anthropic: 'Anthropic',
    openai: 'OpenAI',
    google: 'Google',
    deepseek: 'DeepSeek',
    mistral: 'Mistral',
    meta: 'Meta',
    groq: 'Groq',
    xai: 'xAI',
    ollama: 'Ollama',
    openrouter: 'OpenRouter',
    qwen: 'Qwen',
    copilot: 'Copilot',
  };
  if (labels[providerValue]) return labels[providerValue];
  return providerValue
    ? providerValue.replace(/(^|[-_\s])([a-z])/g, (_, prefix, ch) => `${prefix}${ch.toUpperCase()}`)
    : 'Unknown';
}

function splitProviderAndModel(model) {
  const rawModel = String(model || '').trim();
  if (!rawModel) {
    return { providerKey: '', providerLabel: 'Unknown', modelLabel: 'unknown' };
  }
  const slashIndex = rawModel.indexOf('/');
  if (slashIndex > 0) {
    const providerKey = rawModel.slice(0, slashIndex);
    const modelLabel = rawModel.slice(slashIndex + 1) || rawModel;
    return {
      providerKey,
      providerLabel: providerDisplayLabel(providerKey),
      modelLabel,
    };
  }
  return {
    providerKey: '',
    providerLabel: 'Unknown',
    modelLabel: rawModel,
  };
}

function formatRunModelMetadata(run, runtimeOverride = null) {
  const runtimeKey = String(runtimeOverride != null ? runtimeOverride : (run && run.runtime ? run.runtime : '')).trim().toLowerCase();
  const runtimeLabel = runtimeDisplayLabel(runtimeKey);
  const parts = splitProviderAndModel(run && run.model ? run.model : '');
  const effortLabel = run && run.effort ? String(run.effort) : 'default';
  const providerLabel = parts.providerLabel;
  const modelLabel = parts.modelLabel;
  return {
    runtimeKey,
    runtimeLabel,
    providerLabel,
    modelLabel,
    effortLabel,
    summaryText: `Runtime: ${runtimeLabel} | Provider: ${providerLabel} | Model: ${modelLabel} | Effort: ${effortLabel}`,
    cardChipText: modelLabel === 'unknown' ? providerLabel : modelLabel,
  };
}

function sortAgentRunsForDisplay(runs) {
  return [...(Array.isArray(runs) ? runs : [])].sort((left, right) => {
    const leftRunning = normalizedRunStatus(left) === 'running' ? 0 : 1;
    const rightRunning = normalizedRunStatus(right) === 'running' ? 0 : 1;
    if (leftRunning !== rightRunning) return leftRunning - rightRunning;
    return String(right && right.started_at ? right.started_at : '').localeCompare(
      String(left && left.started_at ? left.started_at : '')
    );
  });
}

function isKillableStatus(status) {
  return status === 'running';
}

function isRetryableStatus(status) {
  return status === 'failed' || status === 'timeout' || status === 'killed';
}

function parseShellWords(commandLine) {
  const input = String(commandLine || '');
  const words = [];
  let current = '';
  let quote = null;

  for (let index = 0; index < input.length; index++) {
    const ch = input[index];

    if (quote === "'") {
      if (ch === "'") {
        quote = null;
      } else {
        current += ch;
      }
      continue;
    }

    if (quote === '"') {
      if (ch === '"') {
        quote = null;
        continue;
      }
      if (ch === '\\' && index + 1 < input.length) {
        const next = input[index + 1];
        if (next === '\\' || next === '"' || next === '$' || next === '`' || next === '\n') {
          current += next;
          index += 1;
          continue;
        }
      }
      current += ch;
      continue;
    }

    if (/\s/.test(ch)) {
      if (current) {
        words.push(current);
        current = '';
      }
      continue;
    }

    if (ch === "'" || ch === '"') {
      quote = ch;
      continue;
    }

    if (ch === '\\' && index + 1 < input.length) {
      current += input[index + 1];
      index += 1;
      continue;
    }

    current += ch;
  }

  if (quote) return null;
  if (current) words.push(current);
  return words;
}

function shellQuoteArg(arg) {
  const value = String(arg == null ? '' : arg);
  if (!value) return "''";
  if (/^[A-Za-z0-9_@%+=:,./-]+$/.test(value)) return value;
  return `'${value.replace(/'/g, `'"'"'`)}'`;
}

function maskPromptArgs(args) {
  const masked = [];
  for (let index = 0; index < args.length; index++) {
    const arg = args[index];
    if ((arg === '-p' || arg === '--prompt') && index + 1 < args.length) {
      masked.push(arg, '<prompt omitted>');
      index += 1;
      continue;
    }
    if (arg === '--append-system-prompt' && index + 1 < args.length) {
      masked.push(arg, '<system prompt omitted>');
      index += 1;
      continue;
    }
    masked.push(arg);
  }
  return masked;
}

function formatShellArgs(args) {
  return (Array.isArray(args) ? args : []).map(shellQuoteArg).join(' ');
}

async function killSelectedAgentRun() {
  if (!selectedAgentRunId) return;
  const run = activeAgentRuns.find(r => r.run_id === selectedAgentRunId);
  const status = normalizedRunStatus(run);
  if (!isKillableStatus(status)) return;
  if (!confirm('Kill this agent run?')) return;

  try {
    await api(`agent/kill/${encodeURIComponent(selectedAgentRunId)}`, { method: 'POST' });
    await refreshActiveAgentsModal();
    await refreshActiveAgentTail();
  } catch (e) {
    alert(`Failed to kill run: ${e.message || e}`);
  }
}

async function retrySelectedAgentRun() {
  if (!selectedAgentRunId) return;
  const run = activeAgentRuns.find(r => r.run_id === selectedAgentRunId);
  if (!run) return;
  const status = normalizedRunStatus(run);
  if (!isRetryableStatus(status)) return;

  async function submitRetry(allowPausedWorkstream = false) {
    retryingAgentRunId = selectedAgentRunId;
    renderActiveAgentsModal();
    try {
      const suffix = allowPausedWorkstream ? '?allow_paused_workstream=1' : '';
      const data = await api(`retry/agent-run/${encodeURIComponent(selectedAgentRunId)}${suffix}`, { method: 'POST', timeoutMs: 30000 });
      retryingAgentRunId = null;
      renderActiveAgentsModal();
      await refreshActiveAgentsModal();
      await refreshActiveAgentTail();
      if (data && data.run_id) {
        console.info(`Started retry agent run ${data.run_id} from ${selectedAgentRunId}`);
      }
      return true;
    } catch (e) {
      retryingAgentRunId = null;
      renderActiveAgentsModal();

      const message = String(e && e.message ? e.message : e);
      const pausedMatch = message.match(/^Workstream '(.+)' is paused$/);
      if (!allowPausedWorkstream && pausedMatch) {
        const workstreamName = pausedMatch[1];
        const confirmed = confirm(`Workstream \`${workstreamName}\` is paused. Retry?`);
        if (confirmed) {
          return submitRetry(true);
        }
        return false;
      }

      alert(`Failed to retry run: ${message}`);
      return false;
    }
  }

  await submitRetry(false);
}

function setAgentRunStatusFilter(value) {
  agentRunStatusFilter = String(value || '').trim().toLowerCase();
  const selected = selectedAgentRunId
    ? activeAgentRuns.find(r => r.run_id === selectedAgentRunId)
    : null;
  if (selected && agentRunStatusFilter && normalizedRunStatus(selected) !== agentRunStatusFilter) {
    selectedAgentRunId = null;
    selectedAgentArtifacts = null;
    if (activeAgentTailTimer) {
      clearInterval(activeAgentTailTimer);
      activeAgentTailTimer = null;
    }
  }
  renderActiveAgentsModal();
}

function filteredAgentRunsForModal() {
  return agentRunStatusFilter
    ? activeAgentRuns.filter(r => normalizedRunStatus(r) === agentRunStatusFilter)
    : activeAgentRuns;
}

async function refreshActiveAgentsModal() {
  const content = document.getElementById('active-agents-content');
  try {
    activeAgentRuns = sortAgentRunsForDisplay(await api('agent/runs?limit=25', { timeoutMs: 30000 }));
  } catch (e) {
    content.innerHTML = `
      <div class="modal-header">
        <div class="modal-header-left"><h3>Agent Runs</h3></div>
        <div class="modal-header-actions">
          <button class="modal-close" onclick="closeActiveAgentsModal()">&times;</button>
        </div>
      </div>
      <p style="color:#f85149;">Failed to load agent runs: ${esc(e.message || e)}</p>
    `;
    return;
  }

  if (selectedAgentRunId && !activeAgentRuns.some(r => r.run_id === selectedAgentRunId)) {
    selectedAgentRunId = null;
    if (activeAgentTailTimer) {
      clearInterval(activeAgentTailTimer);
      activeAgentTailTimer = null;
    }
  }

  renderActiveAgentsModal();

  const selectedRun = selectedAgentRunId
    ? activeAgentRuns.find(r => r.run_id === selectedAgentRunId)
    : null;
  if ((!selectedRun || normalizedRunStatus(selectedRun) !== 'running') && activeAgentTailTimer) {
    clearInterval(activeAgentTailTimer);
    activeAgentTailTimer = null;
  }

  const visibleRuns = filteredAgentRunsForModal();
  if (selectedAgentRunId) {
    const selectedRun = activeAgentRuns.find(r => r.run_id === selectedAgentRunId);
    if (selectedRun && agentRunStatusFilter && normalizedRunStatus(selectedRun) !== agentRunStatusFilter) {
      selectedAgentRunId = null;
      selectedAgentArtifacts = null;
    }
  }
  if (!selectedAgentRunId && visibleRuns.length > 0) {
    await selectActiveAgentRun(visibleRuns[0].run_id);
  }
}

function renderActiveAgentsModal() {
  captureAgentRunsScrollState();
  const content = document.getElementById('active-agents-content');

  const totalRunCount = activeAgentRuns.length;
  const filteredRuns = filteredAgentRunsForModal();
  const runCount = filteredRuns.length;
  let listHtml = '';
  if (!runCount) {
    listHtml = '<p style="color:#8b949e;">No recent agent runs.</p>';
  } else {
    for (const run of filteredRuns) {
      const activeCls = run.run_id === selectedAgentRunId ? ' active' : '';
      const ws = run.workstream_path || run.workstream_id || 'none';
      const wsHtml = run.workstream_id
        ? `<a href="#" class="agent-workstream-link" data-workstream-id="${esc(run.workstream_id)}">${esc(ws)}</a>`
        : esc(ws);
      const tasks = Array.isArray(run.tasks) ? run.tasks.map(t => t.title).filter(Boolean) : [];
      const taskLabel = tasks.length ? tasks.join(', ') : 'none';
      const started = run.started_at ? new Date(run.started_at).toLocaleString() : 'unknown';
      const ended = run.ended_at ? new Date(run.ended_at).toLocaleString() : 'running';
      const duration = formatRunDuration(run.started_at, run.ended_at);
      const status = normalizedRunStatus(run);
      const statusClass = `agent-status-${esc(status)}`;
      listHtml += `<div class="agent-list-item${activeCls}" data-agent-run-id="${esc(run.run_id)}">
        <div class="agent-name">${esc(run.agent || run.agent_ref || 'unknown')} <span class="agent-status ${statusClass}">${esc(status)}</span></div>
        <div class="agent-meta">Started: ${esc(started)}<br>Ended: ${esc(ended)}<br>Duration: ${esc(duration)}<br>Workstream: ${wsHtml}<br>Tasks: ${esc(taskLabel)}</div>
      </div>`;
    }
  }

  const selected = activeAgentRuns.find(r => r.run_id === selectedAgentRunId) || null;
  const selectedDetails = selectedAgentArtifacts || null;
  const selectedCommandLine = selectedDetails && selectedDetails.run ? String(selectedDetails.run.command_line || '') : '';
  const parsedCommandLine = parseShellWords(selectedCommandLine);
  const selectedCommandArgs = parsedCommandLine && parsedCommandLine.length > 1
    ? formatShellArgs(maskPromptArgs(parsedCommandLine.slice(1)))
    : '';
  const selectedRuntime = selected && selected.runtime
    ? String(selected.runtime)
    : (selectedCommandLine.includes('cline ')
      ? 'cline'
      : ((selectedCommandLine.includes(' copilot ') || selectedCommandLine.includes('/copilot '))
        ? 'copilot'
        : 'claude-code'));
  const selectedRunMeta = formatRunModelMetadata(selected, selectedRuntime);
  const selectedRuntimeLabel = selectedRunMeta.runtimeLabel;
  const selectedModelEffort = selectedRunMeta.summaryText;
  const selectedStatus = selected ? normalizedRunStatus(selected) : '';
  const showKill = !!selected && isKillableStatus(selectedStatus);
  const showRetryButton = !!selected && isRetryableStatus(selectedStatus);
  const canRetrySelectedRun = showRetryButton && retryingAgentRunId !== selectedAgentRunId;
  const selectedRunDetails = selectedDetails && selectedDetails.run ? selectedDetails.run : null;
  const interruptionReason = selectedDetails && selectedDetails.interruption_reason
    ? String(selectedDetails.interruption_reason)
    : '';
  const retry = selectedDetails && selectedDetails.retry ? selectedDetails.retry : null;
  const retriedFromRunId = selectedRunDetails && selectedRunDetails.retried_from_run_id ? String(selectedRunDetails.retried_from_run_id) : '';
  const retriedToRunIds = selectedRunDetails && Array.isArray(selectedRunDetails.retried_to_run_ids)
    ? selectedRunDetails.retried_to_run_ids.map(id => String(id)).filter(Boolean)

  const runLineageHtml = selected

           <div><strong>Status:</strong> ${esc(selectedStatus || 'unknown')}</div>
           <div><strong>Retryable:</strong> ${showRetryButton ? 'Yes' : 'No'}</div>
         ${interruptionReason ? `<div><strong>Interruption:</strong> ${esc(interruptionReason)}</div>` : ''}
           ${retriedFromRunId ? `<div><strong>Retry Of:</strong> <a href="#" class="agent-run-link" data-agent-run-id="${esc(retriedFromRunId)}">${esc(retriedFromRunId)}</a></div>` : '<div><strong>Retry Of:</strong> none</div>'}
           ${retriedToRunIds.length
             ? `<div><strong>Retried As:</strong> ${retriedToRunIds.map(id => `<a href="#" class="agent-run-link" data-agent-run-id="${esc(id)}">${esc(id)}</a>`).join(', ')}</div>`
             : '<div><strong>Retried As:</strong> none</div>'}
         </div>`)
    : '<div style="font-size:12px;color:#8b949e;">Select an agent run from the list.</div>';
  const retryHtml = selected
    ? (selectedAgentArtifactsError
      ? `<div style="font-size:12px;color:#f85149;">Unable to load task retry policy: ${esc(selectedAgentArtifactsError)}</div>`

             <div><strong>Eligible:</strong> ${retry.eligible ? 'Yes' : 'No'}</div>
             ${retry.reason ? `<div><strong>Reason:</strong> ${esc(retry.reason)}</div>` : ''}
             ${retry.max_retries != null ? `<div><strong>Retries Remaining:</strong> ${esc(String(retry.retries_remaining))} / ${esc(String(retry.max_retries))}</div>` : '<div><strong>Retries Remaining:</strong> n/a</div>'}
             <div><strong>Next Retry:</strong> ${retry.next_retry_at ? esc(new Date(retry.next_retry_at).toLocaleString()) : 'none scheduled'}</div>
             ${retry.last_failure_at ? `<div><strong>Last Failure:</strong> ${esc(new Date(retry.last_failure_at).toLocaleString())}</div>` : ''}
             ${retry.policy ? `<div style="color:#8b949e;margin-top:4px;">${esc(retry.policy)}</div>` : ''}
           </div>`
        : '<div style="font-size:12px;color:#8b949e;">Loading retry diagnostics...</div>')
    : '<div style="font-size:12px;color:#8b949e;">Select an agent run from the list.</div>';
  const selectedPrompt = selectedDetails && selectedDetails.run ? String(selectedDetails.run.prompt || '') : '';
  const selectedOutput = selectedDetails ? String(selectedDetails.output || '') : '';
  const outputFallback = !selected
    ? 'Select an agent run from the list.'
    : selectedAgentArtifactsError
      ? `Unable to read run output.\n\n${selectedAgentArtifactsError}`
      : selectedDetails
        ? (selectedOutput
          ? selectedOutput
          : (selectedStatus === 'running'
            ? 'Loading output...'
            : 'No output was captured for this run. This usually means the run exited or was interrupted before anything was written to its log.'))
        : 'Loading output...';
  const cliCalls = selectedDetails && Array.isArray(selectedDetails.cli_calls) ? selectedDetails.cli_calls : [];

    : '<div style="font-size:12px;color:#8b949e;">No normalized provider events found.</div>';

    : '<div style="font-size:12px;color:#8b949e;">No provider context capture warnings.</div>';

  content.innerHTML = `

          <option value="completed" ${agentRunStatusFilter === 'completed' ? 'selected' : ''}>Completed</option>
          <option value="failed" ${agentRunStatusFilter === 'failed' ? 'selected' : ''}>Failed</option>
          <option value="timeout" ${agentRunStatusFilter === 'timeout' ? 'selected' : ''}>Timeout</option>

      <div class="agent-list">${listHtml}</div>

          <button class="agent-detail-tab${outputsTabActive ? ' active' : ''}" data-agent-detail-tab="outputs" onclick="setSelectedAgentDetailTab('outputs')">Outputs</button>
          <button class="agent-detail-tab${retriesTabActive ? ' active' : ''}" data-agent-detail-tab="retries" onclick="setSelectedAgentDetailTab('retries')">Retries</button>
        </div>
        <div class="agent-detail-panel${inputsTabActive ? '' : ' hidden'}" data-agent-detail-panel="inputs">
          <div class="agent-section">
            <h4>${selected ? `${selectedRuntimeLabel} CLI Flags` : 'Agent CLI Flags'}</h4>
            <pre class="agent-tail-pre">${selected ? esc(selectedCommandArgs || 'No flags or args recorded for this run.') : 'Select an agent run from the list.'}</pre>
          </div>
          <div class="agent-section">
            <h4>${selected ? `${selectedRuntimeLabel} Command` : 'Agent Command'}</h4>
            <pre class="agent-tail-pre">${selected ? esc(selectedCommandLine || 'Command line not recorded for this run.') : 'Select an agent run from the list.'}</pre>
          </div>
          <div class="agent-section">
            <h4>Input Prompt</h4>
            <pre class="agent-tail-pre" id="active-agent-input-prompt">${selected ? esc(selectedPrompt || 'Loading prompt...') : 'Select an agent run from the list.'}</pre>
          </div>
        </div>
        <div class="agent-detail-panel${outputsTabActive ? '' : ' hidden'}" data-agent-detail-panel="outputs">
          <div class="agent-section">
            <h4>Output</h4>
            <pre class="agent-tail-pre" id="active-agent-tail-output">${esc(outputFallback)}</pre>
          </div>
          <div class="agent-section">
            <h4>Provider Context</h4>
            <div class="agent-cli-calls">
              <div style="font-size:12px;line-height:1.55;color:#c9d1d9;margin-bottom:8px;">
                <div><strong>Central Store:</strong> ${providerManifest && providerManifest.storage ? esc(providerManifest.storage.context_dir || 'not captured') : 'not captured'}</div>

          <div class="agent-section">

              <h4>RUN RETRY</h4>

          <div class="agent-section">
            <h4>TASK RETRY POLICY</h4>

  content.querySelectorAll('.agent-list-item').forEach(el => {
    el.addEventListener('click', () => selectActiveAgentRun(el.dataset.agentRunId));
  });
  content.querySelectorAll('.agent-run-link').forEach(el => {
    el.addEventListener('click', async (event) => {
      event.preventDefault();
      event.stopPropagation();
      await selectActiveAgentRun(el.dataset.agentRunId);
    });
  });
  content.querySelectorAll('.agent-workstream-link').forEach(el => {
    el.addEventListener('click', async (event) => {

async function selectActiveAgentRun(runId) {
  captureAgentRunsScrollState();
  selectedAgentRunId = runId;
  selectedAgentArtifacts = null;
  selectedAgentArtifactsError = '';
  selectedAgentDetailTab = 'outputs';
  agentRunsScrollState.prompt = 0;
  agentRunsScrollState.output = 0;
  agentRunsScrollState.calls = 0;
  agentRunsScrollState.outputStickToBottom = true;
  renderActiveAgentsModal();
  await refreshActiveAgentTail();
  if (activeAgentTailTimer) clearInterval(activeAgentTailTimer);
  const run = activeAgentRuns.find(r => r.run_id === runId);
  if (run && normalizedRunStatus(run) === 'running') {
    activeAgentTailTimer = setInterval(async () => {
      await refreshActiveAgentTail();
    }, 2000);
  }
}

async function refreshActiveAgentTail() {
  if (!selectedAgentRunId) return;
  const selectedRunIndex = activeAgentRuns.findIndex(r => r.run_id === selectedAgentRunId);
  const selectedRun = selectedRunIndex >= 0 ? activeAgentRuns[selectedRunIndex] : null;
  const shouldUseTail = !!selectedRun && normalizedRunStatus(selectedRun) === 'running' && !!selectedAgentArtifacts;

  async function loadRunDetails() {
    const data = await api(`agent/run/${encodeURIComponent(selectedAgentRunId)}`, { timeoutMs: 30000 });
    selectedAgentArtifacts = data;
    selectedAgentArtifactsError = '';
    if (selectedRunIndex >= 0 && data && data.run) {
      activeAgentRuns[selectedRunIndex] = {
        ...activeAgentRuns[selectedRunIndex],
        ...data.run,
      };
      activeAgentRuns = sortAgentRunsForDisplay(activeAgentRuns);
    }
    if (data && data.run && normalizedRunStatus(data.run) !== 'running' && activeAgentTailTimer) {
      clearInterval(activeAgentTailTimer);
      activeAgentTailTimer = null;
    }
    renderActiveAgentsModal();
  }

  try {
    captureAgentRunsScrollState();
    if (shouldUseTail) {
      const data = await api(`agent/tail/${encodeURIComponent(selectedAgentRunId)}?lines=40`, { timeoutMs: 30000 });
      selectedAgentArtifacts = {
        ...(selectedAgentArtifacts || {}),
        run: {
          ...((selectedAgentArtifacts && selectedAgentArtifacts.run) || {}),
          ...(data.run || {}),
          status: 'running',
        },
        output: String(data.tail || ''),
      };
      selectedAgentArtifactsError = '';
      if (selectedRunIndex >= 0 && data && data.run) {
        activeAgentRuns[selectedRunIndex] = {
          ...activeAgentRuns[selectedRunIndex],
          ...(data.run || {}),
          status: 'running',
        };
        activeAgentRuns = sortAgentRunsForDisplay(activeAgentRuns);
      }
      renderActiveAgentsModal();
      return;
    }

    await loadRunDetails();
  } catch (e) {
    if (shouldUseTail) {
      try {
        await loadRunDetails();
        return;
      } catch (fallbackError) {
        e = fallbackError;
      }
    }
    selectedAgentArtifacts = null;
    selectedAgentArtifactsError = e && (e.message || String(e)) ? (e.message || String(e)) : 'unknown error';
    renderActiveAgentsModal();
    const out = document.getElementById('active-agent-tail-output');
    if (out) out.textContent = `Unable to read run output.\n\n${e.message || e}`;
  }
}

// Close modals on Escape key
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay').forEach(el => {
      if (el.id === 'active-agents-modal') {
        closeActiveAgentsModal();
      } else {
        el.classList.add('hidden');
      }
    });
  }
});

window.addEventListener('storage', (event) => {
  if (event.key !== WORKSTREAM_MANAGER_SOUND_MUTE_STORAGE_KEY) return;
  const muted = refreshWorkstreamManagerMutedPreference();
  if (muted) stopAllWorkstreamManagerAudio();
  renderWorkstreamManagerMuteToggle();
});

// ── Utility ─────────────────────────────────────────────────────
function esc(str) {
  if (str == null) return '';
  const div = document.createElement('div');
  div.textContent = String(str);
  return div.innerHTML;
}

function renderMarkdown(str) {
  if (str == null) return '';
  const source = esc(String(str));
  if (typeof marked !== 'undefined') {
    return marked.parse(source, { breaks: true });
  }
  return '<p>' + source + '</p>';
}

async function copyToClipboard(text, btn) {
  const value = String(text || '');
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(value);
    } else {
      const ta = document.createElement('textarea');
      ta.value = value;
      ta.setAttribute('readonly', 'readonly');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    if (btn) {
      const prev = btn.textContent;
      btn.textContent = 'Copied';
      btn.classList.add('copied');
      window.setTimeout(() => {
        btn.textContent = prev;
        btn.classList.remove('copied');
      }, 1000);
    }
  } catch (e) {
    console.warn('Copy failed:', e);
    if (btn) {
      const prev = btn.textContent;
      btn.textContent = 'Failed';
      window.setTimeout(() => { btn.textContent = prev; }, 1200);
    }
  }
}

// ── Polling for live status ────────────────────────────────────
let _polling = false;
function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    if (_polling) return;  // skip if previous poll still in-flight
    _polling = true;
    try {
      const data = await api('poll/status');
      activeTriggerIds = data.active_triggers || [];
      boardActiveAgentRuns = data.active_agent_run_summaries || [];
      renderSidebar();
      // Update scheduler
      _applySchedulerStatus(data.scheduler);
      // Update Agent Runs sidebar link
      renderAgentRunsLinkLabel(data.active_agent_runs || 0);

      await refreshSelectedBoardMeta();
      if (Date.now() - lastSidebarRefreshAt > SIDEBAR_REFRESH_MS) {
        await loadWorkstreams();
      }
      // Refresh trigger dialog if open
      const triggerModal = document.getElementById('trigger-modal');
      if (triggerModal && !triggerModal.classList.contains('hidden')) {
        showTriggers();
      }
    } catch {} finally { _polling = false; }
  }, 3000);
}

// ── Init ────────────────────────────────────────────────────────
(async function init() {
  const agentsLink = document.getElementById('active-agents-link');
  if (agentsLink) {
    agentsLink.addEventListener('click', (e) => {
      e.preventDefault();
      openActiveAgentsModal();
    });
  }
  const muteButton = document.getElementById('agent-runs-mute-toggle');
  if (muteButton) {
    muteButton.addEventListener('click', async () => {
      try {
        await toggleWorkstreamManagerMute();
      } catch (e) {
        alert('Failed to update mute setting: ' + (e.message || e));
      }
    });
  }
  renderAgentRunsLinkLabel();
  renderWorkstreamManagerMuteToggle();
  try {
    await syncWorkstreamManagerMutedPreferenceFromServer();
  } catch (e) {
    console.error('Failed to load global mute state', e);
  }
  await loadWorkstreams();
  window.addEventListener('popstate', () => {
    openRouteFromNavigator({ replaceHistory: true }).catch((e) => {
      console.error('Failed to restore navigation state', e);
    });
  });
  await openRouteFromNavigator({ replaceHistory: true });
  await loadSchedulerStatus();
  startPolling();
})();
</script>
