}

function buildLockMap(tasks, locks = {}) {
  const lockMap = {};
  for (const task of tasks) {
    lockMap[task.id] = task.lock || { locked: false };
  }
  for (const [taskId, lock] of Object.entries(locks || {})) {
    lockMap[taskId] = lock || { locked: false };
  }
  return lockMap;
}

async function hydrateBoardLocks(ws, tasks) {
  if (!ws || !ws.id || !selectedWsId) return;

  const requestSeq = ++boardLockRequestSeq;
  try {
    const locks = await api('lock/list/' + ws.id, { timeoutMs: 30000 });
    if (requestSeq !== boardLockRequestSeq) return;
    if (selectedWsId !== ws.id) return;
    if (isBoardDragInProgress) return;
    updateBoard(ws, tasks, buildLockMap(tasks, locks));
  } catch {}
}

// ── Load board ──────────────────────────────────────────────────
async function loadBoard() {
  if (!selectedWsId) return;

  let board;
  try {
    // Load the board first, then hydrate lock badges asynchronously.
    board = await api('board/' + selectedWsId, { timeoutMs: 30000 });
  } catch (e) {
    if (e && e.code === 'NOT_FOUND') {
      try {
        await api('workstream/read/' + selectedWsId, { timeoutMs: 10000 });
        board = await api('board/' + selectedWsId, { timeoutMs: 30000 });
      } catch (retryErr) {
        e = retryErr;
      }
    }
  }

  if (!board) {
    const boardEl = document.getElementById('board');
    if (boardEl) {
      boardEl.innerHTML = `<div style="padding:16px;color:#f85149;">Failed to load workstream board: ${esc(e.message || e)}</div>`;
    }
    return;
  }

  const ws = board.workstream;
  const tasks = board.tasks;
  selectedWs = ws;
  currentBoardRevision = board.revision || '';

  renderBoardHeader(ws);
  updateBoard(ws, tasks, buildLockMap(tasks), { force: true });
  const emptyState = document.getElementById('empty-state');
  if (emptyState) emptyState.style.display = 'none';
  hydrateBoardLocks(ws, tasks);
  void maybePlayInitialTuningUpSound();
}

// ── Render board header ─────────────────────────────────────────
function renderBoardHeader(ws) {
  const header = document.getElementById('board-header');
  header.style.display = 'flex';
  const statusCls = ws.paused ? 'paused' : 'active';
  const pausedStateCount = getPausedStates(ws).length;
  const pausedTriggerCount = (ws.triggers || []).filter(t => t.paused).length;
  const partialPauseBits = [];
  if (pausedStateCount) partialPauseBits.push(`${pausedStateCount} column${pausedStateCount === 1 ? '' : 's'}`);
  if (pausedTriggerCount) partialPauseBits.push(`${pausedTriggerCount} trigger${pausedTriggerCount === 1 ? '' : 's'}`);
  const statusLabel = ws.paused
    ? 'Paused'
    : (partialPauseBits.length ? `Active (${partialPauseBits.join(', ')} paused)` : 'Active');
  const btnLabel = ws.paused ? 'Resume' : 'Pause';
  const triggerCount = (ws.triggers || []).length;
  const activeCount = (ws.triggers || []).filter(t => activeTriggerIds.includes(t.id)).length;
  const triggerLabel = activeCount > 0
    ? `Triggers (${triggerCount}, ${activeCount} active)`
    : `Triggers (${triggerCount})`;
  const triggerBtn = triggerCount > 0
    ? `<button class="trigger-btn${activeCount > 0 ? ' trigger-btn-active' : ''}" onclick="showTriggers()">${triggerLabel}</button>`
    : '';
  const infoBtn = `<button class="info-btn" onclick="showWorkstreamInfo()">Info</button>`;
  const contextBtn = `<button class="context-btn" onclick="showWorkstreamContext()">Context</button>`;
  const settingsBtn = `<button class="settings-btn" onclick="showWorkstreamSettings()">Settings</button>`;
  header.innerHTML = `
    <h2>${esc(ws.name)}</h2>
    <span class="ws-status ${statusCls}">${statusLabel}</span>
    ${triggerBtn}
    ${infoBtn}
    ${contextBtn}
    ${settingsBtn}
    <button class="pause-btn" onclick="togglePause()">${btnLabel}</button>
  `;
}

function taskRunIds(run) {
  const ids = [];
  if (Array.isArray(run.task_ids)) ids.push(...run.task_ids);
  if (Array.isArray(run.tasks)) {
    for (const task of run.tasks) {
      if (task && task.id) ids.push(task.id);
    }
  }
  return [...new Set(ids.map(id => String(id || '')).filter(Boolean))];
}

function buildBoardAgentRunMap() {
  const map = {};
  for (const run of boardActiveAgentRuns || []) {
    if (normalizedRunStatus(run) !== 'running') continue;
    for (const taskId of taskRunIds(run)) {
      if (!map[taskId]) map[taskId] = run;
    }
  }
  return map;
}

function normalizeProgressSummary(progress) {
  if (!progress || !Array.isArray(progress.items) || !progress.items.length) return null;
  return {
    run_id: progress.run_id || '',
    total: Number(progress.total || progress.items.length || 0),
    done: Number(progress.done || 0),
    current_item_id: progress.current_item_id || '',
    inferred_current: !!progress.inferred_current,
    updated_at: progress.updated_at || '',
    items: progress.items.map(item => ({
      id: item.id || '',
      text: item.text || item.title || '',
      status: item.status || 'pending',
      message: item.message || '',
    })),
  };
}

function normalizeBoardRun(run) {
  return {
    run_id: run.run_id || '',
    agent: run.agent || '',
    agent_ref: run.agent_ref || '',
    task_ids: taskRunIds(run),
    started_at: run.started_at || '',
    ended_at: run.ended_at || '',
    status: normalizedRunStatus(run),
    runtime: run.runtime || '',
    model: run.model || '',
    effort: run.effort || '',
    progress_summary: normalizeProgressSummary(run.progress_summary),
  };
}

function boardRenderKey(ws, tasks, lockMap) {
  return JSON.stringify({
    workstream: {
      id: ws && ws.id,
      name: ws && ws.name,
      paused: !!(ws && ws.paused),
      paused_states: getPausedStates(ws),
      task_states: ws && ws.task_states,
      triggers: (ws && ws.triggers || []).map(t => ({ id: t.id, name: t.name, state: t.state, on_state: t.on_state, paused: !!t.paused, agent: t.agent })),
    },
    tasks: (tasks || []).map(t => ({
      id: t.id,
      title: t.title,
      status: t.status,
      paused: !!t.paused,
      tags: t.tags || [],
      scheduled_at: t.scheduled_at || '',
      retry_count: t.retry_count || 0,
      last_failure_at: t.last_failure_at || '',
      error: t._error || '',
    })),
    locks: Object.fromEntries(Object.entries(lockMap || {}).map(([taskId, lock]) => [taskId, {
      locked: !!(lock && lock.locked),
      agent_id: lock && lock.agent_id || '',
      acquired_at: lock && lock.acquired_at || '',
      subprocess_pid: lock && lock.subprocess_pid || '',
    }])),
    activeRuns: (boardActiveAgentRuns || []).map(normalizeBoardRun),
  });
}

function updateBoard(ws, tasks, lockMap, options = {}) {
  currentBoardTasks = tasks || [];
  currentBoardLockMap = lockMap || buildLockMap(currentBoardTasks);
  const nextKey = boardRenderKey(ws, currentBoardTasks, currentBoardLockMap);
  if (!options.force && nextKey === currentBoardRenderKey) {
    updateBoardAgentDurations();
    return;
  }
  currentBoardRenderKey = nextKey;
  renderBoard(ws, currentBoardTasks, currentBoardLockMap);
}

function updateBoardAgentDurations() {
  document.querySelectorAll('.card-agent-duration[data-started-at]').forEach(el => {
    el.textContent = formatRunDuration(el.dataset.startedAt, el.dataset.endedAt || null);
  });
}

function syncBoardAgentTimer() {
  const hasRunningCardAgents = !!document.querySelector('.card-agent-duration[data-started-at]');
  if (hasRunningCardAgents && !boardAgentTimer) {
    boardAgentTimer = setInterval(updateBoardAgentDurations, 1000);
  } else if (!hasRunningCardAgents && boardAgentTimer) {
    clearInterval(boardAgentTimer);
    boardAgentTimer = null;
  }
  updateBoardAgentDurations();
}

function renderCardProgress(progress) {
  const normalized = normalizeProgressSummary(progress);
  if (!normalized) return '';
  const currentId = normalized.current_item_id;
  const orderedItems = normalized.items
    .map((item, index) => ({ item, index }))
    .sort((a, b) => {
      const statusA = String(a.item.status || 'pending').toLowerCase();
      const statusB = String(b.item.status || 'pending').toLowerCase();
      const activeA = a.item.id === currentId && (statusA === 'active' || normalized.inferred_current);
      const activeB = b.item.id === currentId && (statusB === 'active' || normalized.inferred_current);
      const rankA = activeA ? 1 : (statusA === 'done' ? 0 : 2);
      const rankB = activeB ? 1 : (statusB === 'done' ? 0 : 2);
      return rankA - rankB || a.index - b.index;
    })
    .map(entry => entry.item);
  const rows = orderedItems.map(item => {
    const status = String(item.status || 'pending').toLowerCase();
    const isCurrent = item.id === currentId && (status === 'active' || normalized.inferred_current);
    const visualStatus = isCurrent ? 'active' : status;
    let mark = '';
    if (visualStatus === 'done') mark = '&#10003;';
    if (visualStatus === 'blocked') mark = '!';
    const title = item.message ? `${item.text} - ${item.message}` : item.text;
    return `<div class="card-progress-item ${esc(visualStatus)}" title="${esc(title)}">`
      + `<span class="card-progress-check ${esc(visualStatus)}">${mark}</span>`
      + `<span class="card-progress-text">${esc(item.text)}</span>`
      + `</div>`;
  }).join('');
  return `<div class="card-progress-list" title="${esc(normalized.done)} of ${esc(normalized.total)} checklist items done">${rows}</div>`;
}

function renderDetailChecklist(progress) {
  const normalized = normalizeProgressSummary(progress);
  if (!normalized) {
    return `<div class="detail-checklist-empty">No active checklist available for this task.</div>`;
  }

  const currentId = normalized.current_item_id;
  const orderedItems = normalized.items
    .map((item, index) => ({ item, index }))
    .sort((a, b) => {
      const statusA = String(a.item.status || 'pending').toLowerCase();
      const statusB = String(b.item.status || 'pending').toLowerCase();
      const activeA = a.item.id === currentId && (statusA === 'active' || normalized.inferred_current);
      const activeB = b.item.id === currentId && (statusB === 'active' || normalized.inferred_current);
      const rankA = activeA ? 1 : (statusA === 'done' ? 0 : 2);
      const rankB = activeB ? 1 : (statusB === 'done' ? 0 : 2);
      return rankA - rankB || a.index - b.index;
    })
    .map(entry => entry.item);

  const rows = orderedItems.map(item => {
    const status = String(item.status || 'pending').toLowerCase();
    const isCurrent = item.id === currentId && (status === 'active' || normalized.inferred_current);
    const visualStatus = isCurrent ? 'active' : status;
    let mark = '';
    if (visualStatus === 'done') mark = '&#10003;';
    if (visualStatus === 'blocked') mark = '!';
    const messageHtml = item.message ? `<div class="detail-checklist-message">${esc(item.message)}</div>` : '';
    return `<li class="detail-checklist-item ${esc(visualStatus)}">`
      + `<span class="card-progress-check ${esc(visualStatus)}">${mark}</span>`
      + `<div class="detail-checklist-text">${esc(item.text)}${messageHtml}</div>`
      + `</li>`;
  }).join('');

  return `<ul class="detail-checklist-list" title="${esc(normalized.done)} of ${esc(normalized.total)} checklist items done">${rows}</ul>`;
}

// ── Render board columns ────────────────────────────────────────
function renderBoard(ws, tasks, lockMap) {
  const board = document.getElementById('board');
  const wsScroll = boardScrollByWorkstream[selectedWsId] || { boardX: 0, columns: {} };
  // Capture latest in-DOM scroll before replacing markup.
  wsScroll.boardX = board.scrollLeft;
  board.querySelectorAll('.column[data-state] .column-cards').forEach(el => {
    const state = el.closest('.column')?.dataset?.state;
    if (state) wsScroll.columns[state] = el.scrollTop;
  });
  boardScrollByWorkstream[selectedWsId] = wsScroll;
  const states = Object.keys(ws.task_states || {});

  let html = '';
  for (const state of states) {
    const stateTasks = tasks.filter(t => t.status === state);
    const paused = isStatePaused(state, ws);
    const pauseTitle = paused ? `Resume ${state}` : `Pause ${state}`;
    html += `<div class="column${paused ? ' column-paused' : ''}" data-state="${esc(state)}">
      <div class="column-header">
        <div class="column-title-row">
          <span class="column-title-label">${esc(state)}</span>
          <button class="column-add-btn" type="button" data-create-state="${encodeURIComponent(state)}" title="Add task to ${esc(state)}">+</button>
        </div>
        <div class="column-header-actions">
          <button class="column-pause-btn${paused ? ' paused' : ''}" type="button" data-column-pause-state="${encodeURIComponent(state)}" title="${esc(pauseTitle)}" aria-label="${esc(pauseTitle)}">${paused ? ICON_PLAY : ICON_PAUSE}</button>
          <span class="count">${stateTasks.length}</span>
        </div>
      </div>
      <div class="column-cards">`;

    for (const task of stateTasks) {
      const lock = lockMap[task.id];
      html += renderCard(task, lock, state);
    }

    html += `</div></div>`;
  }
  // Add _error column if any broken tasks exist
  const errorTasks = tasks.filter(t => t._error);
  if (errorTasks.length) {
    html += `<div class="column">
      <div class="column-header" style="color: #f08080;">
        ⚠ corrupt
        <span class="count">${errorTasks.length}</span>
      </div>
      <div class="column-cards">`;
    for (const task of errorTasks) {
      html += renderCard(task, { locked: false });
    }
    html += `</div></div>`;
  }

  board.innerHTML = html;

  // Restore scroll positions after re-render.
  const restored = boardScrollByWorkstream[selectedWsId] || { boardX: 0, columns: {} };
  board.scrollLeft = restored.boardX || 0;
  board.querySelectorAll('.column[data-state] .column-cards').forEach(el => {
    const state = el.closest('.column')?.dataset?.state;
    if (state && Number.isFinite(restored.columns[state])) {
      el.scrollTop = restored.columns[state];
    }
  });

  board.querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', () => showTaskDetail(el.dataset.taskId));
  });
  board.querySelectorAll('[data-create-state]').forEach((el) => {
    el.addEventListener('click', (event) => {
      event.stopPropagation();
      showCreateTaskModal(decodeURIComponent(el.dataset.createState || ''));
    });
  });
  board.querySelectorAll('[data-column-pause-state]').forEach((el) => {
    el.addEventListener('click', async (event) => {
      event.stopPropagation();
      const state = decodeURIComponent(el.dataset.columnPauseState || '');
      await toggleColumnPause(state, el);
    });
  });

  board.querySelectorAll('.card-agent-link').forEach(el => {
    el.addEventListener('click', async (event) => {
      event.preventDefault();
      event.stopPropagation();
      await openAgentRun(el.dataset.agentRunId);
    });
  });

  setupTaskReorderDnD(board);
  syncBoardAgentTimer();
}

function showCreateTaskModal(state) {
  if (!selectedWsId || !selectedWs) return;

  const states = Object.keys(selectedWs.task_states || {});
  const targetState = states.includes(state) ? state : (states[0] || 'pending');
  const modal = document.getElementById('create-task-modal');
  const content = document.getElementById('create-task-modal-content');
  if (!modal || !content) return;

  content.dataset.targetState = targetState;
  content.innerHTML = `
    <div class="modal-header">
      <div class="modal-header-left"><h3>Create Task</h3></div>
      <div class="modal-header-actions">
        <button class="modal-close" onclick="closeModal('create-task-modal')">&times;</button>
      </div>
    </div>
    <div class="create-task-subtitle">${esc(selectedWs.name)} · ${esc(targetState)}</div>
    <div class="create-task-form">
      <div class="create-task-field">
        <label for="create-task-title">Title</label>
        <input id="create-task-title" class="create-task-input" type="text" placeholder="Task title" maxlength="200" />
      </div>
      <div class="create-task-field">
        <label for="create-task-description">Description</label>
        <textarea id="create-task-description" class="create-task-textarea" placeholder="Add task details..."></textarea>
      </div>
      <div class="create-task-field">
        <label>Tags</label>
        ${renderTagEditor({ editorId: 'create-task-tags', tags: [], wsId: selectedWsId })}
      </div>
      <div id="create-task-error" class="create-task-error"></div>
      <div class="create-task-actions">
        <button id="create-task-cancel" class="create-task-cancel" type="button">Cancel</button>
        <button id="create-task-submit" class="create-task-submit" type="button">Create Task</button>
      </div>
    </div>`;

  const titleInput = content.querySelector('#create-task-title');
  const descriptionInput = content.querySelector('#create-task-description');
  const errorEl = content.querySelector('#create-task-error');
  const cancelBtn = content.querySelector('#create-task-cancel');
  const submitBtn = content.querySelector('#create-task-submit');
  const createTaskTagEditor = initTagEditor(content.querySelector('[data-tag-editor-id="create-task-tags"]'), {
    initialTags: [],
    wsId: selectedWsId,
  });

  const submit = async () => {
    const title = String(titleInput?.value || '').trim();
    const description = String(descriptionInput?.value || '').trim();
    if (!title) {
      if (errorEl) errorEl.textContent = 'Title is required.';
      titleInput?.focus();
      return;
    }

    if (errorEl) errorEl.textContent = '';
    if (submitBtn) submitBtn.disabled = true;
    if (cancelBtn) cancelBtn.disabled = true;
    try {
      await api('task/create/' + selectedWsId, {
        method: 'POST',
        body: {
          title,
          description,
          status: targetState,
          tags: createTaskTagEditor.getTags(),
        },
      });
      closeModal('create-task-modal');
      await loadBoard();
    } catch (e) {
      if (errorEl) errorEl.textContent = e.message || String(e);
      if (submitBtn) submitBtn.disabled = false;
      if (cancelBtn) cancelBtn.disabled = false;
    }
  };

  cancelBtn?.addEventListener('click', () => closeModal('create-task-modal'));
  submitBtn?.addEventListener('click', submit);
  titleInput?.addEventListener('keydown', async (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      await submit();
    }
  });
  descriptionInput?.addEventListener('keydown', async (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      e.preventDefault();
      await submit();
    }
  });

  modal.classList.remove('hidden');
  titleInput?.focus();
}

// ── Render a single card ────────────────────────────────────────
function renderCard(task, lock, state) {
  // Tags above title
  let tagsHtml = '';
  if (task.tags && task.tags.length) {
    tagsHtml = '<div class="card-tags">';
    for (const tag of task.tags) {
      const color = getTagColor(selectedWsId, tag);
      tagsHtml += `<span class="card-tag" style="background:${color}">${esc(tag)}</span>`;
    }
    tagsHtml += '</div>';
  }

  const cardRun = buildBoardAgentRunMap()[task.id] || null;

  // Meta line (lock, schedule — no tags here)
  let meta = '';
  if (lock && lock.locked) {
    const run = cardRun;
    const agentLabel = lock.agent_id || (run && (run.agent || run.agent_ref)) || 'agent';
    if (run && run.run_id) {
      const duration = formatRunDuration(run.started_at, run.ended_at);
      const runMeta = formatRunModelMetadata(run);
      meta += `<button type="button" class="card-lock card-agent-link" data-agent-run-id="${esc(run.run_id)}" title="Open ${esc(agentLabel)} run · ${esc(runMeta.summaryText)}">${ICON_AGENT} ${esc(agentLabel)} <span class="card-agent-model">· ${esc(runMeta.cardChipText)}</span> <span class="card-agent-duration" data-started-at="${esc(run.started_at || '')}" data-ended-at="${esc(run.ended_at || '')}">${esc(duration)}</span></button>`;
    } else {
      meta += `<span class="card-lock">${ICON_AGENT} ${esc(agentLabel)}</span>`;
    }
  }
  const progressHtml = renderCardProgress(cardRun && cardRun.progress_summary);
  const checklistAgentSeparator = progressHtml && lock && lock.locked
    ? '<div class="card-agent-separator"></div>'
    : '';
  if (task.scheduled_at) {
    const scheduleLabel = formatCardScheduleDate(task.scheduled_at);
    meta += `<span class="card-schedule">${ICON_SCHEDULE} ${esc(scheduleLabel)}</span>`;
  }

  const errorClass = task._error ? ' card-error' : (task.status === 'failed' ? ' card-failed' : '');
  const errorMsg = task._error ? `<div class="card-error-msg" title="${esc(task._error)}">⚠ ${esc(task._error)}</div>` : '';
  const taskErrors = Array.isArray(task.task_errors)
    ? task.task_errors.filter(item => item && !item.cleared_at)
    : [];
  const taskErrorClass = taskErrors.length ? ' card-task-error' : '';
  const taskErrorMsg = taskErrors.length
    ? `<div class="card-task-error-msg" title="${esc(taskErrors[0].message || 'Task error')}">⚠ ${esc(taskErrors[0].type || 'error')}: ${esc(taskErrors[0].message || 'Task error')}</div>`
    : '';

  let failedInfo = '';
  if (task.status === 'failed' && !task._error) {
    const retryCount = task.retry_count || 0;
    const failedAt = task.last_failure_at ? new Date(task.last_failure_at).toLocaleString() : '';
    failedInfo = `<div class="card-failed-info">`
      + `<span>⚠ Failed${retryCount ? ` (${retryCount} retries)` : ''}${failedAt ? ` · ${failedAt}` : ''}</span>`
      + `<button class="card-retry-btn" onclick="event.stopPropagation(); retryTask('${task.id}')">↻ Retry</button>`
      + `</div>`;
  }

  const canDrag = !task._error && !(lock && lock.locked);
  const isPaused = !!task.paused;
  const pauseTitle = isPaused ? 'Resume task (allow agent pickup)' : 'Pause task (prevent agent pickup)';
  const tokenUsage = !cardRun && task && task.token_usage && (Number(task.token_usage.input_tokens || 0) > 0 || Number(task.token_usage.output_tokens || 0) > 0)
    ? `<div class="card-token-usage">Tokens: ${esc(Number(task.token_usage.input_tokens || 0).toLocaleString())} in ${esc(Number(task.token_usage.output_tokens || 0).toLocaleString())} out</div>`
    : '';
  const pauseBtn = task._error
    ? ''
    : `<button class="card-pause-btn${isPaused ? ' paused' : ''}" type="button" data-task-pause-id="${esc(task.id)}" title="${esc(pauseTitle)}" aria-label="${esc(pauseTitle)}" aria-pressed="${isPaused ? 'true' : 'false'}" onclick="event.stopPropagation(); toggleTaskPause('${esc(task.id)}', this)">${isPaused ? ICON_PLAY : ICON_PAUSE}</button>`;
  const pausedClass = isPaused ? ' card-paused' : '';
  return `<div class="card${errorClass}${pausedClass}${taskErrorClass}" data-task-id="${task.id}" data-state="${esc(state)}" draggable="${canDrag ? 'true' : 'false'}">
    ${pauseBtn}
    ${tagsHtml}
    <div class="card-title">${esc(task.title)}</div>
    ${progressHtml}
    ${errorMsg}
    ${taskErrorMsg}
    ${failedInfo}
    ${meta ? `${checklistAgentSeparator}<div class="card-meta">${meta}</div>` : ''}
    ${tokenUsage}
  </div>`;
}

function clearTaskDropIndicators(board = document.getElementById('board')) {
  if (!board) return;
  board.querySelectorAll('.drop-before, .drop-after').forEach((el) => {
    el.classList.remove('drop-before', 'drop-after');
  });
  board.querySelectorAll('.column-cards.drop-active').forEach((el) => {
    el.classList.remove('drop-active');
  });
}

async function reorderTaskRelative(taskId, targetTaskId, position) {
  await api('task/reorder/' + taskId, {
    method: 'POST',
    body: { target_task_id: targetTaskId, position },
  });
}

function setupTaskReorderDnD(board) {
  if (!board || !selectedWs) return;

  const cards = Array.from(board.querySelectorAll('.column[data-state] .card[draggable="true"]'));
  const columns = Array.from(board.querySelectorAll('.column[data-state] .column-cards'));

  for (const card of cards) {
    card.addEventListener('dragstart', (e) => {
      const taskId = card.dataset.taskId;
      const state = card.dataset.state;
      if (!taskId || !state) {
        e.preventDefault();
        return;
      }
      taskDragState = { taskId, state };
      isBoardDragInProgress = true;
      card.classList.add('card-dragging');
      if (e.dataTransfer) {
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', taskId);
      }
    });

    card.addEventListener('dragend', () => {
      card.classList.remove('card-dragging');
      taskDragState = null;
      isBoardDragInProgress = false;
      clearTaskDropIndicators(board);
    });

    card.addEventListener('dragover', (e) => {
      if (!taskDragState) return;
      if (taskDragState.taskId === card.dataset.taskId) return;
      if (taskDragState.state !== card.dataset.state) return;
      e.preventDefault();

      clearTaskDropIndicators(board);
      const rect = card.getBoundingClientRect();
      const midpoint = rect.top + rect.height / 2;
      if (e.clientY < midpoint) {
        card.classList.add('drop-before');
      } else {
        card.classList.add('drop-after');
      }
    });

    card.addEventListener('drop', async (e) => {
      if (!taskDragState) return;
      if (taskDragState.taskId === card.dataset.taskId) return;
      if (taskDragState.state !== card.dataset.state) return;
      e.preventDefault();

      const rect = card.getBoundingClientRect();
      const midpoint = rect.top + rect.height / 2;
      const position = e.clientY < midpoint ? 'before' : 'after';
      const targetTaskId = card.dataset.taskId;

      clearTaskDropIndicators(board);
      try {
        await reorderTaskRelative(taskDragState.taskId, targetTaskId, position);
        await loadBoard();
      } catch (err) {
        alert('Reorder failed: ' + (err.message || err));
      } finally {
        taskDragState = null;
        isBoardDragInProgress = false;
      }
    });
  }

  for (const columnCards of columns) {
    const column = columnCards.closest('.column[data-state]');
    const state = column?.dataset?.state;
    if (!state) continue;

    columnCards.addEventListener('dragover', (e) => {
      if (!taskDragState) return;
      if (taskDragState.state !== state) return;
      e.preventDefault();
      if (!e.target.closest('.card')) {
        clearTaskDropIndicators(board);
        columnCards.classList.add('drop-active');
      }
    });

    columnCards.addEventListener('drop', async (e) => {
      if (!taskDragState) return;
      if (taskDragState.state !== state) return;
      if (e.target.closest('.card')) return;
      e.preventDefault();

      const candidates = Array.from(columnCards.querySelectorAll('.card[draggable="true"]'))
        .filter((el) => el.dataset.taskId !== taskDragState.taskId);
      const last = candidates[candidates.length - 1];

      clearTaskDropIndicators(board);
      if (!last) {
        taskDragState = null;
        isBoardDragInProgress = false;
        return;
      }

      try {
        await reorderTaskRelative(taskDragState.taskId, last.dataset.taskId, 'after');
        await loadBoard();
      } catch (err) {
        alert('Reorder failed: ' + (err.message || err));
      } finally {
        taskDragState = null;
        isBoardDragInProgress = false;
      }
    });
  }
}

// ── Retry a failed task ─────────────────────────────────────────
async function retryTask(taskId) {
  try {
    await api('retry/task/' + taskId, { method: 'POST' });
    await loadBoard(selectedWsId);
  } catch (e) {
    alert('Retry failed: ' + (e.message || e));
  }
}

// ── Show confirmation dialog for invalid transitions ──────────────────
function showTransitionConfirmation(fromState, toState, onConfirm, onCancel) {
  const modal = document.getElementById('confirmation-modal');
  const content = document.getElementById('confirmation-dialog-content');

  content.innerHTML = `
    <h3>Invalid State Transition</h3>
    <p>The transition from <strong>${esc(fromState)}</strong> to <strong>${esc(toState)}</strong> is not allowed by the state machine.</p>
    <div class="confirmation-transition">${esc(fromState)} → ${esc(toState)}</div>
    <p>Do you want to proceed with this override?</p>
    <div class="confirmation-buttons">
      <button class="confirmation-btn confirm">Proceed</button>
      <button class="confirmation-btn cancel">Cancel</button>
    </div>
  `;

  const confirmBtn = content.querySelector('.confirmation-btn.confirm');
  const cancelBtn = content.querySelector('.confirmation-btn.cancel');

  confirmBtn.addEventListener('click', () => {
    modal.classList.add('hidden');
    if (onConfirm) onConfirm();
  });

  cancelBtn.addEventListener('click', () => {
    modal.classList.add('hidden');
    if (onCancel) onCancel();
  });

  modal.classList.remove('hidden');
}

// ── Task detail modal ───────────────────────────────────────────
// ── Build hierarchical workstream <option> list ─────────────────
// Returns an HTML string of <optgroup> / <option> suitable for a <select>.
// Parents come first, children indented with em-dash prefix.
function buildWorkstreamOptions(workstreams, selectedId) {
  // Group by parent_id
  const roots = workstreams.filter(w => !w.parent_id);
  const byParent = {};
  for (const w of workstreams) {
    if (w.parent_id) {
      if (!byParent[w.parent_id]) byParent[w.parent_id] = [];
      byParent[w.parent_id].push(w);
    }
  }

  function renderOption(ws, depth) {
    const prefix = depth > 0 ? '— '.repeat(depth) : '';
    const sel = ws.id === selectedId ? ' selected' : '';
    return `<option value="${esc(ws.id)}"${sel}>${prefix}${esc(ws.name)}</option>`;
  }

  function renderGroup(ws, depth) {
    let html = renderOption(ws, depth);
    const children = byParent[ws.id] || [];
    children.sort((a, b) => a.name.localeCompare(b.name));
    for (const child of children) {
      html += renderGroup(child, depth + 1);
    }
    return html;
  }

  roots.sort((a, b) => a.name.localeCompare(b.name));
  return roots.map(r => renderGroup(r, 0)).join('');
}

async function showTaskDetail(taskId, opts = {}) {
  const { updateHistory = true, replaceHistory = false } = opts;
  let task, lockData;
  const boardTask = currentBoardTasks.find(t => String(t.id) === String(taskId)) || null;
  const detailWorkstreamId = (boardTask && boardTask.workstream_id) || selectedWsId || '';
  const detailQuery = detailWorkstreamId ? `?workstream_id=${encodeURIComponent(detailWorkstreamId)}` : '';
  try {
    [task, lockData] = await Promise.all([
      api('task/read/' + taskId + detailQuery),
      api('lock/status/' + taskId + detailQuery).catch(() => ({ locked: false })),
    ]);
  } catch (err) {
    if (err && err.code === 'CORRUPT_TASK') {
      const reason = err.message ? '\n\nReason: ' + err.message : '';
      alert('Cannot open this task because its task file is invalid.\n\nTask ID: ' + taskId + reason + '\n\nFix the file at:\nworkstreams/*/tasks/' + taskId + '.yaml');
      return;
    }

    const reason = err && err.message ? err.message : 'Unknown error';
    const code = err && err.code ? '\nCode: ' + err.code : '';
    alert('Cannot open this task.\n\nTask ID: ' + taskId + '\n\nReason: ' + reason + code);
    return;
  }

  if (!selectedWs || selectedWs.id !== task.workstream_id) {
    await selectWorkstream(task.workstream_id, {
      updateHistory: false,
      keepTaskModal: true,
    });
  }

  const modal = document.getElementById('task-modal');
  const content = document.getElementById('task-modal-content');
  const detailRun = buildBoardAgentRunMap()[task.id] || null;

  // Get all possible states and categorize them
  const allStates = selectedWs && selectedWs.task_states ? Object.keys(selectedWs.task_states) : [];
  const allowedStates = (selectedWs && selectedWs.task_states)
    ? (selectedWs.task_states[task.status] || [])
    : [];
  const disallowedStates = allStates.filter(s => s !== task.status && !allowedStates.includes(s));

  // Only show state change UI if not locked
  const hasAnyStates = allStates.length > 0;
  const canChangeState = !lockData?.locked && hasAnyStates;

  // Build state menu with all states + move/duplicate panel
  let stateMenu = '';
  if (canChangeState) {
    // Allowed transitions
    if (allowedStates.length > 0) {
      stateMenu += allowedStates
        .map(s => `<button class="state-option-btn allowed" data-next-state="${encodeURIComponent(s)}" data-valid="true"><span class="state-option-icon">✓</span>${esc(s)}</button>`)
        .join('');
    }
    // Disallowed transitions
    if (disallowedStates.length > 0) {
      if (allowedStates.length > 0) {
        stateMenu += `<div style="border-top: 1px solid rgba(255,255,255,0.1); margin: 6px 0;"></div>`;
      }
      stateMenu += disallowedStates
        .map(s => `<button class="state-option-btn disallowed" data-next-state="${encodeURIComponent(s)}" data-valid="false"><span class="state-option-icon">✗</span>${esc(s)}</button>`)
        .join('');
    }
    // Move / Duplicate section
    const wsOpts = buildWorkstreamOptions(allWorkstreams, task.workstream_id);
    const curWsStates = selectedWs && selectedWs.task_states ? Object.keys(selectedWs.task_states) : [];
    const stateOpts = curWsStates
      .map(s => `<option value="${esc(s)}" ${s === task.status ? 'selected' : ''}>${esc(s)}</option>`)
      .join('');
    stateMenu += `<div style="border-top: 1px solid rgba(255,255,255,0.1); margin: 6px 0;"></div>
      <div class="move-panel">
        <div class="move-panel-title">Move / Duplicate to</div>
        <select id="move-target-ws">${wsOpts}</select>
        <select id="move-target-state">${stateOpts}</select>
        <div class="move-panel-actions">
          <button class="btn-move" id="btn-do-move">Move</button>
          <button class="btn-duplicate" id="btn-do-duplicate">Duplicate</button>
        </div>
      </div>`;
  }

  const stateLabel = canChangeState ? `${esc(task.status)} ▾` : esc(task.status);
  const lockTitle = lockData?.locked
    ? `Cannot change state while locked by ${lockData.agent_id}`
    : '';

  // ── Header bar: state left, actions right ──
  let html = `<div class="modal-header">
    <div class="modal-header-left">
      <div class="state-control">
        <button
          type="button"
          class="status-badge state-badge-btn${lockData?.locked ? ' locked' : ''}"
          ${canChangeState ? '' : 'disabled'}
          ${lockTitle ? `title="${esc(lockTitle)}"` : ''}
        >${stateLabel}</button>
        ${canChangeState ? `<div class="state-menu hidden">${stateMenu}</div>` : ''}
      </div>
    </div>
    <div class="modal-header-actions">
      <button class="action-btn danger" onclick="archiveTask('${task.id}')">Archive</button>
      <button class="modal-close" onclick="closeModal('task-modal')">&times;</button>
    </div>
  </div>`;

  // ── Main column ──
  let main = '';

  // Title
  const isEditingTitle = taskTitleEditingTaskId === String(task.id);
  if (isEditingTitle) {
    main += `<input id="task-title-edit" class="task-title-input" type="text" value="${esc(task.title)}" maxlength="200" aria-label="Task title" onkeydown="handleTaskTitleEditKeydown(event, '${task.id}')" onblur="saveEditedTaskTitle('${task.id}')" />`;
  } else {
    main += `<h3><button class="task-title-button" type="button" onclick="startEditTaskTitle('${task.id}')" title="Edit task title">${esc(task.title)}</button></h3>`;
  }
  main += `<div class="task-uid">Task UID: ${esc(task.id)} <button class="uid-copy-btn" type="button" onclick="copyToClipboard('${esc(task.id)}', this)">Copy</button><button class="uid-copy-btn" type="button" data-open-task-file="${esc(task.id)}" title="Open task YAML in VS Code">Open in VS Code</button></div>`;

  // Tags (colored)
  const taskTags = Array.isArray(task.tags) ? task.tags : [];
  const tagsLocked = !!(lockData && lockData.locked);
  main += `<div class="detail-section"><h4>Tags</h4>`;
  main += renderTagEditor({
    editorId: 'task-tags-editor',
    tags: taskTags,
    wsId: selectedWsId,
    disabled: tagsLocked,
  });
  main += `<div id="task-tags-status" class="tag-editor-status"></div>`;
  if (tagsLocked) {
    main += `<div class="tag-editor-hint">Tags cannot be changed while this task is locked.</div>`;
  }
  main += `</div>`;

  // Description
  const isEditingDescription = taskDescriptionEditingTaskId === String(task.id);
  main += `<div class="detail-section">
    <div class="detail-section-header">
      <h4>Description</h4>
      ${isEditingDescription ? '' : `<button class="description-edit-link" type="button" onclick="startEditTaskDescription('${task.id}')">Edit</button>`}
    </div>`;
  if (isEditingDescription) {
    main += `<textarea id="task-description-edit" class="description-edit-textarea">${esc(task.description || '')}</textarea>`;
    main += `<div class="comment-actions">
      <button class="comment-save-btn" type="button" onclick="saveEditedTaskDescription('${task.id}', this)">Save</button>
      <button class="comment-cancel-btn" type="button" onclick="cancelEditTaskDescription('${task.id}')">Cancel</button>
    </div>`;
  } else if (task.description) {
    main += `<div class="detail-description">${renderMarkdown(task.description)}</div>`;
  } else {
    main += `<div class="attachment-hint">No description yet.</div>`;
  }
  main += `</div>`;

  // Attachments (artifact paths)
  const checklistHtml = renderDetailChecklist(detailRun && detailRun.progress_summary);
  main += `<div class="detail-section"><h4>Checklist</h4>${checklistHtml}</div>`;

  // Attachments (artifact paths)
  const attachments = Array.isArray(task.attachments) ? task.attachments : [];
  const attachmentsLocked = !!(lockData && lockData.locked);
  main += `<div class="detail-section"><h4>Attachments</h4>`;
  if (attachments.length) {
    main += `<ul class="attachment-list">`;
    for (const path of attachments) {
      const encPath = encodeURIComponent(path);
      const removeBtn = attachmentsLocked
        ? `<button class="attachment-remove-btn" data-attachment-path="${encPath}" disabled>Remove</button>`
        : `<button class="attachment-remove-btn" data-attachment-path="${encPath}">Remove</button>`;
      main += `<li class="attachment-item">
        <button class="attachment-path-btn" data-preview-attachment-path="${encPath}" title="Preview attachment">${esc(path)}</button>
        ${removeBtn}
      </li>`;
    }
    main += `</ul>`;
  } else {
    main += `<div class="attachment-hint">No attachments yet.</div>`;
  }

  main += `<div id="attachment-preview" class="attachment-preview hidden">
    <div class="attachment-preview-head">
      <div>
        <div class="attachment-preview-label">Resolved file path</div>
        <div id="attachment-preview-path" class="attachment-preview-path"></div>
      </div>
      <div class="attachment-preview-actions">
        <button id="attachment-preview-open" class="attachment-open-link hidden" type="button">Open in VS Code</button>
        <button id="attachment-preview-close" class="attachment-preview-close" type="button">Close</button>
      </div>
    </div>
    <div class="attachment-preview-body">
      <div id="attachment-preview-content" class="attachment-preview-content"></div>
    </div>
  </div>`;

  main += `<div class="attachment-input-row">
    <input id="new-attachment-path" class="attachment-input" type="text" placeholder="Artifact path (e.g. Research/example_project/brief.md)" ${attachmentsLocked ? 'disabled' : ''} />
    <button id="btn-add-attachment" class="attachment-add-btn" ${attachmentsLocked ? 'disabled' : ''}>Add</button>
  </div>`;
  main += `</div>`;

  // Lock
  if (lockData && lockData.locked) {
    const expires = new Date(lockData.expires_at).toLocaleTimeString();
    main += `<div class="detail-section">
      <h4>Agent Lock</h4>
      <div class="detail-lock">${ICON_AGENT} ${esc(lockData.agent_id)} &nbsp;·&nbsp; expires ${expires}</div>
    </div>`;
  }

  // Schedule
  if (task.scheduled_at) {
    const schedDate = new Date(task.scheduled_at).toLocaleString();
    const actionDesc = task.scheduled_action
      ? (task.scheduled_action.type === 'run_agent'
          ? `Run agent: ${task.scheduled_action.agent}`
          : `Command: ${task.scheduled_action.command}`)
      : 'No action defined';
    main += `<div class="detail-section">
      <h4>Scheduled Action</h4>
      <div class="detail-schedule">${ICON_SCHEDULE} ${schedDate}<br>${esc(actionDesc)}</div>
    </div>`;
  }

  // Comments
  const comments = Array.isArray(task.comments) ? task.comments : [];
  const commentAudit = (task.audit || []).filter(a => a.type === 'comment');
  const commentDraft = taskCommentDraftByTaskId[task.id] || '';
  main += `<div class="detail-section"><h4>Comments</h4>`;

  // Trello-style placement: new comment composer first, thread below.
  main += `<div class="comment-composer">`;
  main += `<textarea id="new-task-comment" placeholder="Write a comment..." oninput="setTaskCommentDraft('${task.id}', this.value)">${esc(commentDraft)}</textarea>`;
  main += `<div class="comment-actions">`;
  main += `<button id="btn-add-comment" class="comment-save-btn" type="button">Save</button>`;
  main += `</div>`;
  main += `</div>`;

  if (!comments.length) {
    main += `<div class="attachment-hint">No comments yet.</div>`;
  }

  for (const item of comments.map((comment, index) => ({ comment, index })).reverse()) {
    const c = item.comment;
    const commentIndex = item.index;
    let message = '';
    let author = 'Unknown';
    let timestamp = '';

    if (typeof c === 'string') {
      message = stripCommentDatePrefix(c);
      // Match by content rather than by index — index-based matching breaks on
      // duplicated tasks where the audit trail was reset but comments were copied.
      const needle = message.slice(0, 120);
      const auditEntry = commentAudit.find(a => String(a.description || '').includes(needle)) || null;
      if (auditEntry) {
        timestamp = auditEntry.timestamp || '';
        const inferred = inferCommentFromAudit(auditEntry);
        if (inferred.author) author = inferred.author;
      }
    } else if (c && typeof c === 'object') {
      message = stripCommentDatePrefix(c.message || '');
      author = c.author || 'Unknown';
      timestamp = c.timestamp || '';
      if (!c.author) {
        author = inferAuthorFromAuditTrail(task, message, timestamp);
      }
    }

    const when = formatCommentTimestamp(timestamp);
    const isEditing = !!taskCommentEditing
      && taskCommentEditing.taskId === String(task.id)
      && Number(taskCommentEditing.index) === Number(commentIndex);

    main += `<div class="comment">`;
    main += `<div class="comment-meta">`;
    main += `<span>${esc(when || '')}</span>`;
    main += `<span>`;
    main += `<button class="comment-edit-link" type="button" onclick="startEditTaskComment('${task.id}', ${commentIndex})">Edit</button>`;
    main += `&nbsp;`;
    main += `<button class="comment-delete-link" type="button" onclick="deleteTaskComment('${task.id}', ${commentIndex}, this)">Delete</button>`;
    main += `</span>`;
    main += `</div>`;

    if (isEditing) {
      main += `<textarea id="task-comment-edit-${commentIndex}" class="comment-edit-textarea">${esc(message)}</textarea>`;
      main += `<div class="comment-actions">`;
      main += `<button class="comment-save-btn" type="button" onclick="saveEditedTaskComment('${task.id}', ${commentIndex}, this)">Save</button>`;
      main += `<button class="comment-cancel-btn" type="button" onclick="cancelEditTaskComment('${task.id}')">Cancel</button>`;
      main += `</div>`;
    } else {
      main += `<div class="comment-text markdown-content"><div class="comment-author-line">${esc(author)}:</div><div class="comment-body">${renderMarkdown(message)}</div></div>`;
    }
    main += `</div>`;
  }

  main += `</div>`;

  // ── Aside column (audit trail) ──
  let aside = '';
  if (task.audit && task.audit.length) {
    aside += `<div class="detail-section"><h4>Audit Trail</h4>`;
    const auditEmojis = {
      created: '🆕',
      status_change: '🔀',
      updated: '✏️',
      scheduled: '📅',
      schedule_cleared: '🚫',
      schedule_fired: '🚀',
      comment: '💬',
      agent_run: '🤖',
      archived: '📦',
    };
    for (const a of [...task.audit].reverse()) {
      const time = new Date(a.timestamp).toLocaleString();
      const emoji = auditEmojis[a.type] || '📋';
      const desc = a.type === 'comment' ? 'Comment added' : esc(a.description);
      aside += `<div class="audit-entry"><span class="audit-icon">${emoji}</span><span class="audit-type">${esc(a.type)}</span> <span class="audit-desc">${desc}</span><span class="audit-time">${time}</span></div>`;
    }
    aside += `</div>`;
  }

  html += `<div class="modal-body">`;
  html += `<div class="modal-main">${main}</div>`;
  if (aside) html += `<div class="modal-aside">${aside}</div>`;
  html += `</div>`;

  content.innerHTML = html;

  const stateBtn = content.querySelector('.state-badge-btn');
  const stateMenuEl = content.querySelector('.state-menu');
  if (stateBtn && stateMenuEl && canChangeState) {
    stateBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      stateMenuEl.classList.toggle('hidden');
    });

    stateMenuEl.addEventListener('click', (e) => e.stopPropagation());

    stateMenuEl.querySelectorAll('[data-next-state]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const nextState = decodeURIComponent(btn.dataset.nextState || '');
        const isValid = btn.dataset.valid === 'true';

        if (isValid) {
          // Allowed transition: execute immediately
          btn.disabled = true;
          try {
            await api('task/update/' + task.id, {
              method: 'POST',
              body: { status: nextState },
            });
            closeModal('task-modal');
            await loadBoard();
          } catch (e) {
            btn.disabled = false;
            alert('State change failed: ' + (e.message || e));
          }
        } else {
          // Disallowed transition: show confirmation
          showTransitionConfirmation(task.status, nextState, async () => {
            btn.disabled = true;
            try {
              await api('task/update/' + task.id, {
                method: 'POST',
                body: { status: nextState, force: true },
              });
              closeModal('task-modal');
              await loadBoard();
            } catch (e) {
              btn.disabled = false;
              alert('State change failed: ' + (e.message || e));
            }
          }, () => {
            // Cancelled
          });
        }
      });
    });

    content.addEventListener('click', () => stateMenuEl.classList.add('hidden'));
  }

  // ── Tags editor wiring ───────────────────────────────────────
  const initialTaskTags = normalizeTaskTags(taskTags);
  const taskTagsStatus = content.querySelector('#task-tags-status');
  let persistedTaskTags = initialTaskTags.slice();
  let pendingTaskTags = null;
  let taskTagsPersistInFlight = false;

  async function persistTaskTags(nextTags) {
    if (tagsLocked) return;
    pendingTaskTags = normalizeTaskTags(nextTags);
    if (taskTagsPersistInFlight) return;

    taskTagsPersistInFlight = true;
    try {
      while (pendingTaskTags) {
        const tagsToSave = pendingTaskTags.slice();
        pendingTaskTags = null;

        if (sameTaskTags(persistedTaskTags, tagsToSave)) {
          continue;
        }

        if (taskTagsStatus) taskTagsStatus.textContent = 'Saving...';
        await api('task/update/' + task.id, {
          method: 'POST',
          body: {
            tags: tagsToSave,
          },
        });
        persistedTaskTags = tagsToSave.slice();
        await loadBoard({ preserveSelection: true });
      }

      if (taskTagsStatus) taskTagsStatus.textContent = '';
    } catch (e) {
      pendingTaskTags = null;
      if (taskTagsStatus) taskTagsStatus.textContent = 'Save failed: ' + (e.message || e);
    } finally {
      taskTagsPersistInFlight = false;
    }
  }

  const taskTagEditor = initTagEditor(content.querySelector('[data-tag-editor-id="task-tags-editor"]'), {
    initialTags: initialTaskTags,
    disabled: tagsLocked,
    wsId: selectedWsId,
    onChange: (nextTags) => {
      if (taskTagsStatus) taskTagsStatus.textContent = '';
      persistTaskTags(nextTags);
    },
  });

  // ── Move / Duplicate panel wiring ──────────────────────────────
  const wsSelect = content.querySelector('#move-target-ws');
  const stateSelect = content.querySelector('#move-target-state');
  const moveBtn = content.querySelector('#btn-do-move');
  const dupBtn = content.querySelector('#btn-do-duplicate');

  async function refreshStateDropdown(wsId) {
    try {
      const ws = await api('workstream/read/' + wsId);
      const states = ws && ws.task_states ? Object.keys(ws.task_states) : [];
      stateSelect.innerHTML = states.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
    } catch {
      stateSelect.innerHTML = '<option value="">— failed to load —</option>';
    }
  }

  if (wsSelect && stateSelect) {
    wsSelect.addEventListener('change', () => refreshStateDropdown(wsSelect.value));

    if (moveBtn) {
      moveBtn.addEventListener('click', async () => {
        const targetWsId = wsSelect.value;
        const targetState = stateSelect.value;
        if (!targetState) return;
        moveBtn.disabled = true;
        dupBtn.disabled = true;
        try {
          await api('task/move/' + task.id, {
            method: 'POST',
            body: { workstream_id: targetWsId, status: targetState },
          });
          closeModal('task-modal');
          // If moved to a different workstream, stay on current board
          await loadBoard();
        } catch (e) {
          moveBtn.disabled = false;
          dupBtn.disabled = false;
          alert('Move failed: ' + (e.message || e));
        }
      });
    }

    if (dupBtn) {
      dupBtn.addEventListener('click', async () => {
        const targetWsId = wsSelect.value;
        const targetState = stateSelect.value;
        if (!targetState) return;
        moveBtn.disabled = true;
        dupBtn.disabled = true;
        try {
          const newTask = await api('task/duplicate/' + task.id, {
            method: 'POST',
            body: { workstream_id: targetWsId, status: targetState },
          });
          closeModal('task-modal');
          await loadBoard();
          // Brief confirmation
          const inSameWs = targetWsId === task.workstream_id;
          const msg = inSameWs
            ? `Duplicated! New task "${newTask.title}" created in state "${newTask.status}".`
            : `Duplicated to workstream "${targetWsId}" in state "${newTask.status}".`;
          // Use a non-blocking toast if available, else console
          console.info(msg);
        } catch (e) {
          moveBtn.disabled = false;
          dupBtn.disabled = false;
          alert('Duplicate failed: ' + (e.message || e));
        }
      });
    }
  }

  // ── Comments wiring ─────────────────────────────────────────
  const addCommentBtn = content.querySelector('#btn-add-comment');
  const newCommentInput = content.querySelector('#new-task-comment');
  if (addCommentBtn && newCommentInput) {
    addCommentBtn.addEventListener('click', async () => {
      await addTaskComment(task.id, addCommentBtn);
    });

    newCommentInput.addEventListener('keydown', async (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        e.preventDefault();
        await addTaskComment(task.id, addCommentBtn);
      }
    });
  }

  // ── Attachment add/remove wiring ──────────────────────────────
  const addAttachmentBtn = content.querySelector('#btn-add-attachment');
  const newAttachmentInput = content.querySelector('#new-attachment-path');
  if (addAttachmentBtn && newAttachmentInput) {
    const addAttachment = async () => {
      const path = String(newAttachmentInput.value || '').trim();
      if (!path) return;
      addAttachmentBtn.disabled = true;
      try {
        await api('task/attach/' + task.id, {
          method: 'POST',
          body: { path },
        });
        await showTaskDetail(task.id, { updateHistory: false });
      } catch (e) {
        addAttachmentBtn.disabled = false;
        alert('Add attachment failed: ' + (e.message || e));
      }
    };

    addAttachmentBtn.addEventListener('click', addAttachment);
    newAttachmentInput.addEventListener('keydown', async (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        await addAttachment();
      }
    });
  }

  content.querySelectorAll('[data-attachment-path]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const path = decodeURIComponent(btn.dataset.attachmentPath || '');
      if (!path) return;
      if (!confirm(`Remove attachment?\n\n${path}`)) return;
      btn.disabled = true;
      try {
        await api('task/detach/' + task.id, {
          method: 'POST',
          body: { path },
        });
        await showTaskDetail(task.id, { updateHistory: false });
      } catch (e) {
        btn.disabled = false;
        alert('Remove attachment failed: ' + (e.message || e));
      }
    });
  });

  const openTaskFileBtn = content.querySelector('[data-open-task-file]');
  if (openTaskFileBtn) {
    openTaskFileBtn.addEventListener('click', async () => {
      openTaskFileBtn.disabled = true;
      try {
        const qs = `?workstream_id=${encodeURIComponent(task.workstream_id || '')}`;
        await api('task/open-file/' + encodeURIComponent(task.id) + qs);
      } catch (e) {
        alert('Open task YAML in VS Code failed: ' + (e.message || e));
      } finally {
        openTaskFileBtn.disabled = false;
      }
    });
  }

  // ── Attachment preview wiring ─────────────────────────────────
  const previewEl = content.querySelector('#attachment-preview');
  const previewPathEl = content.querySelector('#attachment-preview-path');
  const previewContentEl = content.querySelector('#attachment-preview-content');
  const previewOpenEl = content.querySelector('#attachment-preview-open');
  const previewCloseBtn = content.querySelector('#attachment-preview-close');
  let currentPreviewAttachmentPath = '';

  function setAttachmentPreviewText(value, extraClass = '') {
    if (!previewContentEl) return;
    previewContentEl.innerHTML = '';
    previewContentEl.className = `attachment-preview-content text-preview ${extraClass}`.trim();
    previewContentEl.textContent = value;
  }

  function setAttachmentPreviewMarkdown(value) {
    if (!previewContentEl) return;
    previewContentEl.innerHTML = '';
    previewContentEl.className = 'attachment-preview-content markdown-content markdown-preview';
    previewContentEl.innerHTML = renderMarkdown(value);
  }

  function isMarkdownPath(path) {
    return /\.(md|markdown|mdown|mkd|mkdn|mdx)$/i.test(String(path || ''));
  }

  function setAttachmentPreviewImage(src, altText) {
    if (!previewContentEl) return;
    previewContentEl.innerHTML = '';
    previewContentEl.className = 'attachment-preview-content';
    const img = document.createElement('img');
    img.className = 'attachment-preview-image';
    img.src = src;
    img.alt = altText || 'Attachment preview';
    previewContentEl.appendChild(img);
  }

  function hideAttachmentPreview() {
    if (!previewEl) return;
    previewEl.classList.add('hidden');
    if (previewPathEl) previewPathEl.textContent = '';
    if (previewContentEl) {
      previewContentEl.innerHTML = '';
      previewContentEl.className = 'attachment-preview-content';
    }
    if (previewOpenEl) {
      previewOpenEl.classList.add('hidden');
      previewOpenEl.disabled = false;
    }
    currentPreviewAttachmentPath = '';
  }

  if (previewCloseBtn) {
    previewCloseBtn.addEventListener('click', hideAttachmentPreview);
  }

  if (previewOpenEl) {
    previewOpenEl.addEventListener('click', async () => {
      const path = currentPreviewAttachmentPath;
      if (!path) return;
      previewOpenEl.disabled = true;
      try {
        const qs = `?path=${encodeURIComponent(path)}&workstream_id=${encodeURIComponent(task.workstream_id || '')}`;
        await api('artifact/open' + qs);
      } catch (e) {
        alert('Open in VS Code failed: ' + (e.message || e));
      } finally {
        previewOpenEl.disabled = false;
      }
    });
  }

  content.querySelectorAll('[data-preview-attachment-path]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const path = decodeURIComponent(btn.dataset.previewAttachmentPath || '');
      if (!path || !previewEl || !previewPathEl || !previewContentEl) return;
      currentPreviewAttachmentPath = path;
      previewEl.classList.remove('hidden');
      previewPathEl.textContent = 'Loading...';
      setAttachmentPreviewText('Loading...');
      if (previewOpenEl) {
        previewOpenEl.classList.remove('hidden');
        previewOpenEl.disabled = false;
      }
      try {
        const qs = `?path=${encodeURIComponent(path)}&workstream_id=${encodeURIComponent(task.workstream_id || '')}`;
        const data = await api('artifact/read' + qs);
        previewPathEl.textContent = data.resolved_path || '(unresolved)';
        if (data.preview_type === 'image' && data.data_url) {
          setAttachmentPreviewImage(data.data_url, path);
        } else if (data.preview_error) {
          setAttachmentPreviewText('Preview failed: ' + data.preview_error);
        } else {
          const text = String(data.content || '');
          if (isMarkdownPath(path)) {
            setAttachmentPreviewMarkdown(text);
          } else {
            setAttachmentPreviewText(text);
          }
        }
        if (previewOpenEl && data.resolved_path) {
          previewOpenEl.classList.remove('hidden');
        }
      } catch (e) {
        previewPathEl.textContent = '(failed to resolve path)';
        setAttachmentPreviewText('Preview failed: ' + (e.message || e));
        if (previewOpenEl) {
          previewOpenEl.classList.remove('hidden');
          previewOpenEl.disabled = false;
        }
      }
    });
  });

  modal.classList.remove('hidden');
  if (updateHistory) {
    syncNavigatorRoute(buildTaskRoute(task.id), { replace: replaceHistory });
  }
}

function cronToHuman(expr) {
  const p = expr.trim().split(/\s+/);
  if (p.length !== 5) return expr;
  const [min, hr, dom, mon, dow] = p;
  const all = v => v === '*';
  const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const monNames = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // Convert UTC hour:minute to local time string with GMT offset
  function utcTimeToLocal(utcHr, utcMin) {
    const now = new Date();
    const d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), +utcHr, +utcMin));
    const localHr = d.getHours();
    const localMin = String(d.getMinutes()).padStart(2, '0');
    const offMin = -d.getTimezoneOffset();
    const offSign = offMin >= 0 ? '+' : '-';
    const absOff = Math.abs(offMin);
    const offHr = Math.floor(absOff / 60);
    const offM = absOff % 60;
    const gmt = offM ? `GMT${offSign}${offHr}:${String(offM).padStart(2,'0')}` : `GMT${offSign}${offHr}`;
    return `${localHr}:${localMin} (${gmt})`;
  }

  if (all(min) && all(hr) && all(dom) && all(mon) && all(dow)) return 'Every minute';
  if (!all(min) && all(hr) && all(dom) && all(mon) && all(dow))
    return min === '0' ? 'Every hour' : `Every hour at :${min.padStart(2,'0')}`;
  if (!all(min) && !all(hr) && all(dom) && all(mon) && all(dow))
    return `Daily at ${utcTimeToLocal(hr, min)}`;
  if (!all(min) && !all(hr) && all(dom) && all(mon) && !all(dow))
    return `${dayNames[+dow] || dow}s at ${utcTimeToLocal(hr, min)}`;
  if (!all(min) && !all(hr) && !all(dom) && all(mon) && all(dow))
    return `${dom}${ordSuffix(+dom)} of every month at ${utcTimeToLocal(hr, min)}`;
  return expr;
}
function ordSuffix(n) {
  const s = ['th','st','nd','rd'];
  const v = n % 100;
  return s[(v-20)%10] || s[v] || s[0];
}

async function showWorkstreamInfo() {
  if (!selectedWsId) return;
  const modal = document.getElementById('workstream-info-modal');
  const content = document.getElementById('workstream-info-content');
  const info = await api('workstream/info/' + selectedWsId);

  function buildStateMachineFlowchart(taskStates) {
    if (!taskStates || typeof taskStates !== 'object') return '(no state machine defined)';
    const states = Object.keys(taskStates);
    if (!states.length) return '(no state machine defined)';

    const initial = states[0];
    const lines = [initial];
    const expanded = new Set([initial]);

    function walk(state, prefix, pathSet) {
      const nextStates = Array.isArray(taskStates[state]) ? taskStates[state] : [];
      nextStates.forEach((nextState, idx) => {
        const isLast = idx === nextStates.length - 1;
        const branchPrefix = `${prefix}${isLast ? '└─> ' : '├─> '}`;
        const childIndent = `${prefix}${isLast ? '    ' : '│   '}`;

        if (pathSet.has(nextState)) {
          lines.push(`${branchPrefix}${nextState} (cycle)`);
          return;
        }

        lines.push(`${branchPrefix}${nextState}`);
        const childNext = Array.isArray(taskStates[nextState]) ? taskStates[nextState] : [];
        if (!childNext.length) return;

        if (expanded.has(nextState)) {
          lines.push(`${childIndent}↳ (continues from above)`);
          return;
        }

        expanded.add(nextState);
        const nextPath = new Set(pathSet);
        nextPath.add(nextState);
        walk(nextState, childIndent, nextPath);
      });
    }

    walk(initial, '', new Set([initial]));

    const reachable = new Set();
    const queue = [initial];
    while (queue.length) {
      const s = queue.shift();
      if (reachable.has(s)) continue;
      reachable.add(s);
      const next = Array.isArray(taskStates[s]) ? taskStates[s] : [];
      next.forEach(n => {
        if (!reachable.has(n)) queue.push(n);
      });
    }

    const disconnected = states.filter(s => !reachable.has(s));
    if (disconnected.length) {
      lines.push('');
      lines.push('# Disconnected states:');
      disconnected.forEach(s => lines.push(`- ${s}`));
    }

    return lines.join('\n');
  }

  const mountingLines = [
    `Working directory: ${info.working_directory || '(none set at this level)'}`,
    `Artifact root: ${info.artifact_root || '(none set at this level)'}`,
    `Child workstream root: ${info.child_workstream_root || '(none set at this level)'}`,
    `Resolved working directory: ${info.resolved_workspace_path || '(unknown)'}`,
    `Resolved artifact directory: ${info.resolved_artifact_directory || '(unknown)'}`,
    `Resolved child workstream root: ${info.resolved_child_workstream_root || '(unknown)'}`,
  ].join('\n');

  let html = `
    <div class="modal-header">
      <div class="modal-header-left"><h3>Workstream Info</h3></div>
      <div class="modal-header-actions">
        <button class="modal-close" onclick="closeModal('workstream-info-modal')">&times;</button>
      </div>
    </div>
    <div class="ws-info-uid">Workstream UID: ${esc(info.id)} <button class="uid-copy-btn" type="button" onclick="copyToClipboard('${esc(info.id)}', this)">Copy</button></div>
    <div class="detail-section" style="margin-top:0;">
      <h4>MOUNTING</h4>
      <pre class="ws-env-pre">${esc(mountingLines)}</pre>
    </div>
    <div class="detail-section">
      <h4>Environment Variables</h4>
  `;

  const effectiveEnv = info.effective_env || {};
  const effectiveLines = Object.keys(effectiveEnv)
    .sort()
    .map(k => `${k}=${effectiveEnv[k]}`)
    .join('\n');
  html += `
    <div class="ws-env-section">
      <div class="ws-env-title">Effective (resolved)</div>
      <pre class="ws-env-pre">${effectiveLines ? esc(effectiveLines) : '# none resolved from hierarchy .env files'}</pre>
    </div>
  `;

  const levels = info.env_hierarchy || [];
  if (!levels.length) {
    html += `<p style="color:#8b949e;">No .env files defined in this workstream hierarchy.</p>`;
  } else {
    html += `<details class="ws-env-breakdown"><summary>Hierarchy breakdown (.env files)</summary>`;
    for (const level of levels) {
      const envMap = level.env || {};
      const lines = Object.keys(envMap)
        .sort()
        .map(k => `${k}=${envMap[k]}`)
        .join('\n');
      html += `
        <div class="ws-env-section">
          <div class="ws-env-title">${esc(level.name)} (${esc(level.id)})</div>
          <pre class="ws-env-pre">${lines ? esc(lines) : '# empty .env'}</pre>
        </div>
      `;
    }
    html += `</details>`;
  }

  html += `
    <div class="ws-sm-section">
      <h4>STATE MACHINE</h4>
      <div class="ws-sm-note">Flowchart view of this workstream's state transitions.</div>
      <pre class="ws-sm-pre">${esc(buildStateMachineFlowchart(info.task_states || {}))}</pre>
    </div>
  `;

  html += `</div>`;
  content.innerHTML = html;
  modal.classList.remove('hidden');
}

async function saveWorkstreamConcurrency() {
  if (!selectedWsId) return;
  const textarea = document.getElementById('workstream-concurrency-textarea');
  const status = document.getElementById('workstream-concurrency-status');
  if (!textarea) return;

  let parsed;
  try {
    parsed = textarea.value.trim() ? JSON.parse(textarea.value) : {};
  } catch (_err) {
    if (status) status.textContent = 'Invalid JSON.';
    return;
  }

  if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
    if (status) status.textContent = 'Concurrency policy must be a JSON object.';
    return;
  }

  if (status) status.textContent = 'Saving...';
  try {
    const updated = await api('workstream/concurrency/' + selectedWsId, {
      method: 'POST',
      body: {
        agent_concurrency: parsed,
      },
    });
    if (selectedWs && selectedWs.id === selectedWsId) {
      selectedWs.agent_concurrency = updated.agent_concurrency || {};
    }
    textarea.value = JSON.stringify(updated.agent_concurrency || {}, null, 2);
    if (status) status.textContent = 'Saved.';
  } catch (err) {
    if (status) status.textContent = err && err.message ? err.message : 'Save failed.';
  }
}
